<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sp1nXI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F6EFE2; --cream-2:#EFE5D3; --ink:#241F19; --ink-soft:#6B6055;
  --orange:#E4762B; --orange-deep:#C05A16; --line:#DCCFB8;
  --club-a:#E4762B; --club-b:#241F19; --club-ink:#FFFFFF;
  --r:14px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.45;
  min-height:100dvh;
  padding:0 16px calc(28px + env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto;
  overscroll-behavior-y:contain;
}
h1,h2,h3{font-family:"Bricolage Grotesque",Archivo,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
h1{font-size:2rem}
h2{font-size:1.35rem}
h3{font-size:1.02rem;font-weight:700}
p{margin:.5em 0}
small{color:var(--ink-soft)}
button{font:inherit;color:inherit}

header.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 0 12px;position:sticky;top:0;background:var(--cream);z-index:20;
}
.brand{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.5rem;letter-spacing:-.03em}
.brand i{font-style:normal;color:var(--orange)}
.crumb{font-size:.78rem;color:var(--ink-soft)}

.card{
  background:var(--cream-2); border:1px solid var(--line);
  border-radius:var(--r); padding:16px; margin:12px 0;
}
.card.club{
  background:linear-gradient(160deg,var(--club-a),var(--club-b));
  border-color:transparent; color:var(--club-ink);
}
.card.club small{color:rgba(255,255,255,.75)}

.btn{
  display:block;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--ink);
  background:var(--ink);color:var(--cream);font-weight:600;cursor:pointer;margin:8px 0;
  text-align:left;transition:transform .08s ease;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--orange);border-color:var(--orange-deep);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:disabled{opacity:.4;cursor:not-allowed}
.btn .sub{display:block;font-weight:500;font-size:.82rem;opacity:.75;margin-top:2px}
.row{display:flex;gap:8px}
.row>.btn{margin:8px 0}
.btn.sm{padding:10px 12px;text-align:center;font-size:.9rem}

.leagues{display:grid;gap:8px}
.league-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--cream-2);cursor:pointer;text-align:left}
.league-btn[aria-pressed="true"]{border-color:var(--orange);background:#fff;box-shadow:inset 0 0 0 1px var(--orange)}
.league-btn b{display:block;font-weight:600}
.flagdot{width:26px;height:26px;border-radius:8px;flex:none}

/* Reel */
.reel{
  height:96px;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:#fff;position:relative;margin:14px 0;
}
.reel-track{position:absolute;inset:0;display:flex;flex-direction:column;transition:transform 2.4s cubic-bezier(.12,.72,.12,1)}
.reel-item{height:96px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:"Bricolage Grotesque";font-weight:800;font-size:1.6rem;letter-spacing:-.02em;gap:10px}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(#fff,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,#fff)}
.reel.spinning{border-color:var(--orange)}
.swatch{width:20px;height:20px;border-radius:6px;flex:none}

/* Pitch */
.pitch{
  position:relative;width:100%;aspect-ratio:68/96;border-radius:16px;margin:12px 0;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 8.33%,rgba(0,0,0,.05) 8.33% 16.66%),
    linear-gradient(170deg,#2E2822,#15120F);
  border:1px solid rgba(0,0,0,.15);overflow:hidden;
}
.pitch .markings{position:absolute;inset:0}
.pitch .markings div{position:absolute;border:1.5px solid rgba(255,255,255,.28)}
.slot{
  position:absolute;transform:translate(-50%,-50%);width:58px;
  background:rgba(255,255,255,.14);border:1.5px dashed rgba(255,255,255,.45);
  border-radius:10px;padding:5px 3px;text-align:center;cursor:pointer;
  color:#fff;font-size:.6rem;line-height:1.15;backdrop-filter:blur(3px);
}
.slot .role{font-weight:700;font-size:.62rem;letter-spacing:.01em}
.slot .nm{display:block;font-weight:600;font-size:.58rem;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .rt{display:inline-block;margin-top:3px;background:#fff;color:var(--ink);
  border-radius:5px;padding:0 4px;font-weight:800;font-size:.6rem}
.slot.filled{border-style:solid;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.slot.filled .rt{background:rgba(255,255,255,.92);color:#241F19}
.slot.active{outline:2px solid #fff;outline-offset:2px}
.slot.pulse{animation:pop .3s ease}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.86)}100%{transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){
  .reel-track{transition-duration:.4s}
  .slot.pulse{animation:none}
}

.picker{margin:10px 0}
.plyr{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:10px 12px}
.plyr .num{width:30px;height:30px;border-radius:9px;background:var(--club-a);color:var(--club-ink);
  display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.plyr .meta{flex:1;min-width:0}
.plyr .meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plyr .meta small{font-size:.74rem}
.plyr .rating{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.25rem}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--orange)}

.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0}
.sheet .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 14px;
  background:linear-gradient(100deg,var(--club-a) 0%,var(--club-a) 48%,var(--club-b2,#241F19) 52%);color:#fff}
.sheet .score .side{text-align:center;font-weight:700;font-size:.9rem}
.sheet .score .nums{font-family:"Bricolage Grotesque";font-weight:800;font-size:2.1rem;letter-spacing:-.03em}
.events{padding:10px 14px;border-bottom:1px solid var(--line)}
.ev{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:5px 0;font-size:.9rem;align-items:baseline}
.ev.away{grid-template-columns:1fr 34px;text-align:right}
.ev .min{color:var(--ink-soft);font-size:.78rem;font-weight:600}
.stat{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;padding:6px 14px;font-size:.84rem}
.stat .sbar{height:6px;border-radius:99px;background:var(--line);display:flex;overflow:hidden}
.stat .sbar span:first-child{background:var(--club-a)}
.stat .sbar span:last-child{background:var(--ink)}
.stat b{font-weight:700;text-align:center}
.stat .lbl{text-align:center;color:var(--ink-soft);font-size:.72rem}

table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
table.tbl td,table.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.tbl th{font-size:.72rem;color:var(--ink-soft);font-weight:600}
table.tbl td:last-child,table.tbl th:last-child{text-align:right}
tr.me td{background:#fff;font-weight:600}

.code{font-family:"Bricolage Grotesque";font-weight:800;font-size:2.4rem;letter-spacing:.18em;
  color:var(--orange);text-align:center;padding:6px 0}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--cream);
  padding:10px 16px;border-radius:99px;font-size:.86rem;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.2)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.foot{color:var(--ink-soft);font-size:.74rem;padding:18px 0 4px;text-align:center}
</style>  
</head>
<body>
<header class="top">
  <div class="brand">Sp1n<i>XI</i></div>
  <div class="crumb" id="crumb"></div>
</header>
<main id="app"></main>
<div class="foot">Squad data cached from API-Football · demo squads until a key is set</div>
<script src="/app.js"></script>
</body>
</html>
